<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>表のサンプル</title>

  <style>
    table {
      border-collapse: collapse;
      width: 400px;
    }

    th, td {
      border: 1px solid #333;
      padding: 8px;
      text-align: center;
    }

    th {
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>

  <table>
    <tr>
      <th>名前</th>
      <th>年齢</th>
      <th>職業</th>
    </tr>

    <tr>
      <td>田中</td>
      <td>25</td>
      <td>エンジニア</td>
    </tr>

    <tr>
      <td>佐藤</td>
      <td>30</td>
      <td>デザイナー</td>
    </tr>
  </table>

</body>
</html>
